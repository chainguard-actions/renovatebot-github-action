name: Test env vars forwarded to container via docker-cmd-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          RENOVATE_TEST_VALUE: hello-renovate
          MY_EXTRA_VAR: extra-value
          NOT_PASSED_VAR: should-not-appear
          LOG_LEVEL: debug
        with:
          token: test-token-123
          renovate-image: node:22-alpine
          docker-cmd-file: tests/fixtures/check-env.js
          additional-env-list: |
            MY_EXTRA_VAR
      - name: Assert action succeeded (script inside container validated env)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
