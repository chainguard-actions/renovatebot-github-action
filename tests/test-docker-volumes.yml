name: Test docker-volumes input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom docker-volumes
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '37.0.0'
          docker-volumes: '/tmp:/tmp;/var/log:/var/log'

      - name: Assert action did not fail due to docker-volumes parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because Renovate itself errors (no repos configured, etc.)
          # but it must NOT fail with a docker-volumes parsing error.
          # We verify the action ran (outcome is either success or failure from Docker).
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with custom docker-volumes, outcome=$OUTCOME"
