name: Test basic usage with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '38'
        env:
          LOG_LEVEL: debug
      - name: Assert action ran (succeeded or failed gracefully against sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
