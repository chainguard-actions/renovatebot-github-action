name: Test basic usage - dry run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Renovate in dry-run mode
        id: action
        uses: .
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_DRY_RUN: full
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: "[]"
          LOG_LEVEL: debug
        with:
          renovate-version: "43"
      - name: Assert action completed successfully
        run: |
          echo "PASS: Renovate action completed without error"
