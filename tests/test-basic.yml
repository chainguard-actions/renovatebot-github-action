name: Test basic usage with token and configurationFile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create renovate config file
        run: |
          cat > /tmp/renovate-config.json << 'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "platform": "github",
            "repositories": []
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          configurationFile: /tmp/renovate-config.json
        env:
          RENOVATE_DRY_RUN: full
          LOG_LEVEL: debug
      - name: Assert action was invoked
        run: |
          echo "Action completed (may have failed due to fake token, which is expected)"
          echo "PASS: inputs token and configurationFile were accepted"
