name: Test basic usage with token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/fake-docker.log
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-docker.log
          case "$*" in
            *--version*) echo "44.0.0" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: dummy-renovate-token-123
      - name: Assert docker invocations
        run: |
          echo "--- fake docker log ---"
          cat /tmp/fake-docker.log
          lines=$(wc -l < /tmp/fake-docker.log)
          if [ "$lines" -ne 2 ]; then
            echo "FAIL: expected 2 docker invocations, got $lines"
            exit 1
          fi
          first=$(sed -n 1p /tmp/fake-docker.log)
          second=$(sed -n 2p /tmp/fake-docker.log)
          if [ "$first" != "run --env FORCE_COLOR=3 --rm ghcr.io/renovatebot/renovate:44 --version" ]; then
            echo "FAIL: unexpected version command: $first"
            exit 1
          fi
          for expected in "run " "--env RENOVATE_TOKEN=dummy-renovate-token-123" "--env FORCE_COLOR=3" "--volume /tmp:/tmp" "--rm ghcr.io/renovatebot/renovate:44"; do
            if ! echo "$second" | grep -qF -- "$expected"; then
              echo "FAIL: main command missing '$expected'"
              exit 1
            fi
          done
          case "$second" in
            *"--rm ghcr.io/renovatebot/renovate:44") ;;
            *) echo "FAIL: image should be the last argument"; exit 1 ;;
          esac
          for unexpected in "--network" "--user" "RENOVATE_CONFIG_FILE" "docker.sock"; do
            if echo "$second" | grep -qF -- "$unexpected"; then
              echo "FAIL: main command unexpectedly contains '$unexpected'"
              exit 1
            fi
          done
          echo "PASS"
