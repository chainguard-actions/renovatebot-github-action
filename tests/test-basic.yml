name: Test basic usage with token and configurationFile
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal renovate config
        run: |
          mkdir -p /tmp/renovate-config
          cat > /tmp/renovate-config/renovate.json <<'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "repositories": []
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          configurationFile: /tmp/renovate-config/renovate.json
        env:
          RENOVATE_TOKEN: fake-token-for-testing
          LOG_LEVEL: debug
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed (possibly with error due to fake token, which is expected)"
          echo "PASS: inputs token and configurationFile were accepted"
