name: Test token with whitespace error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "invalid token with spaces"
          # renovate-version set to a known small image tag to fail fast on docker pull
          # but the token whitespace check happens before docker run

      - name: Assert action failed due to whitespace in token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when token contains whitespace, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when token contained whitespace"
