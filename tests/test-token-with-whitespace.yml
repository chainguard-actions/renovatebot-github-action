name: Test token with whitespace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with token containing whitespace
        id: action
        uses: .
        continue-on-error: true
        with:
          token: 'invalid token with spaces'

      - name: Assert action failed due to whitespace in token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token contains whitespace.
          # renovate.ts validateArguments() checks: /\s/.test(this.input.token.value)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when token contains whitespace, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected token with whitespace"
