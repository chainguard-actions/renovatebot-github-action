name: Test configuration file is mounted into the container
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-docker-calls.log
          case "$*" in
            *" --version"*) echo "99.9.9-fake" ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          rm -f /tmp/fake-docker-calls.log
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          token: test-renovate-token
          configurationFile: tests/fixtures/renovate-config.json
      - name: Assert config file env and volume
        run: |
          cat /tmp/fake-docker-calls.log
          run_line=$(sed -n 2p /tmp/fake-docker-calls.log)
          case "$run_line" in
            *"--env RENOVATE_CONFIG_FILE=/github-action/renovate-config.json"*) echo "ok: env" ;;
            *) echo "FAIL: missing RENOVATE_CONFIG_FILE env"; exit 1 ;;
          esac
          if ! echo "$run_line" | grep -qE -- "--volume /[^ ]*tests/fixtures/renovate-config.json:/github-action/renovate-config.json"; then
            echo "FAIL: missing absolute config volume mount"
            exit 1
          fi
          echo "PASS"
