name: Test docker-network and env-regex inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          docker-network: bridge
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS)$'
        env:
          RENOVATE_TOKEN: fake-token-for-testing
          LOG_LEVEL: debug
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed (possibly with error due to fake token, which is expected)"
          echo "PASS: inputs docker-network and env-regex were accepted"
