name: Test docker-network input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with docker-network input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          docker-network: host
          renovate-version: '43'
          renovate-image: ghcr.io/renovatebot/renovate
          docker-volumes: /tmp:/tmp

      - name: Assert action ran (docker-network input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to Docker/credentials, but it should not
          # fail because docker-network was rejected as an input.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome was not set"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — docker-network input was accepted"
