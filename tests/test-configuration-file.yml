name: Test configurationFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal renovate config file
        run: |
          echo '{}' > /tmp/renovate-config.json

      - name: Run action with configurationFile input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          configurationFile: /tmp/renovate-config.json
          renovate-version: '43'
          renovate-image: ghcr.io/renovatebot/renovate
          docker-volumes: /tmp:/tmp

      - name: Assert action ran (configurationFile input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome was not set"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — configurationFile input was accepted"
