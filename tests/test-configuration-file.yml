name: Test configurationFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal Renovate config file
        run: |
          mkdir -p /tmp/renovate-config
          cat > /tmp/renovate-config/renovate.json << 'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "extends": ["config:base"],
            "dryRun": "full"
          }
          EOF
          echo "Config file created at /tmp/renovate-config/renovate.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '38'
          configurationFile: /tmp/renovate-config/renovate.json
        env:
          LOG_LEVEL: debug
      - name: Assert action ran with configurationFile (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with configurationFile"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
