name: Test configurationFile and additional-env-list inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          configurationFile: renovate.json
          additional-env-list: |
            MY_CUSTOM_VAR
            ANOTHER_VAR
          token: ${{ github.token }}
          renovate-version: '44'
      - name: Assert action ran (configurationFile and additional-env-list accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with configurationFile and additional-env-list inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
