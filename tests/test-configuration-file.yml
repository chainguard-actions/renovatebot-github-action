name: Test configurationFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal renovate config file
        run: |
          cat > /tmp/renovate-config.json << 'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "repositories": []
          }
          EOF

      - name: Run action with configurationFile input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '37.0.0'
          configurationFile: /tmp/renovate-config.json

      - name: Assert action ran with configurationFile input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because Renovate itself errors (no repos configured, etc.)
          # but it must NOT fail due to configurationFile input parsing.
          # We verify the action ran (outcome is either success or failure from Docker).
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with configurationFile input, outcome=$OUTCOME"
