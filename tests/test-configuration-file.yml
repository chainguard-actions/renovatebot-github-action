name: Test configurationFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create renovate config file
        run: |
          cat > /tmp/renovate-config.json << 'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "repositories": []
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          configurationFile: /tmp/renovate-config.json
          token: ${{ github.token }}
          renovate-version: '43'
      - name: Assert action was invoked with configurationFile input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail because Renovate needs specific setup,
          # but we verify the input was accepted (not an input validation error)
          echo "PASS: configurationFile input was accepted"
