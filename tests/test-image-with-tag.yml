name: Test renovate-image containing a tag ignores renovate-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          RENOVATE_TOKEN: test-token-123
        with:
          renovate-image: node:22-alpine
          # Would be an invalid tag if it were used; must be ignored
          renovate-version: this-tag-does-not-exist-xyz
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (version should be ignored)"
            exit 1
          fi
          echo "PASS"
