name: Test token via RENOVATE_TOKEN environment variable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          RENOVATE_TOKEN: ${{ github.token }}
        with:
          renovate-version: '38'
        # Token is provided via RENOVATE_TOKEN env var, not the 'token' input.
        # The action should start (not throw the "MUST be passed" error) and
        # then fail gracefully when Renovate cannot operate on the sentinel repo.

      - name: Assert action ran (not a token-missing error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to Renovate/Docker issues,
          # but NOT fail immediately with a missing-token error.
          # Both success and failure are acceptable here.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with RENOVATE_TOKEN env var"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Renovate/Docker issue on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
