name: Test nonexistent configuration file is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VOL: renovate-test-noconfig-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build fake renovate image
        run: |
          docker build -t fake-renovate:test "$GITHUB_WORKSPACE/tests/fixtures/fake-renovate"
          docker volume rm -f "$VOL" || true
          docker volume create "$VOL"
      - id: renovate
        uses: .
        continue-on-error: true
        with:
          token: test-token
          configurationFile: does-not-exist/renovate-config.js
          renovate-image: fake-renovate:test
          docker-volumes: ${{ env.VOL }}:/out
      - name: Assert action failed and main container never ran
        env:
          OUTCOME: ${{ steps.renovate.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing configuration file"
            exit 1
          fi
          if docker run --rm -v "$VOL:/out" --entrypoint test fake-renovate:test -f /out/env; then
            echo "FAIL: renovate container should not have run"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: docker volume rm -f "$VOL" || true
