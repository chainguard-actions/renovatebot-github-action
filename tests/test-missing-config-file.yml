name: Test nonexistent configurationFile fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI that records invocations
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$T/fakebin"
          LOG="$T/docker-calls.log"
          : > "$LOG"
          cat > "$T/fakebin/docker" <<EOF
          #!/bin/sh
          echo "\$*" >> "$LOG"
          case "\$*" in
            *" --version") echo "44.0.0-fake" ;;
          esac
          exit 0
          EOF
          chmod +x "$T/fakebin/docker"
          echo "$T/fakebin" >> "$GITHUB_PATH"
          echo "DOCKER_LOG=$LOG" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: dummy-token-123
          configurationFile: ${{ github.workspace }}/tests/fixtures/does-not-exist.json
      - name: Assert failure and no main docker run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$DOCKER_LOG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing config file"
            exit 1
          fi
          COUNT=$(wc -l < "$DOCKER_LOG")
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected only the version call, got $COUNT"
            exit 1
          fi
          echo "PASS"
