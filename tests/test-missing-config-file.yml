name: Test missing configuration file error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent configurationFile
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          configurationFile: /nonexistent/renovate-config.json

      - name: Assert action failed due to missing config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the configurationFile does not exist.
          # renovate.ts validateArguments() checks: fs.stat(configurationFile.value).isFile()
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when configurationFile does not exist, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when configurationFile was not found"
