name: Test nonexistent configuration file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          case "$*" in
            *--version*) echo "renovate 99.0.0-fake" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          rm -f /tmp/docker-calls.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: dummy-renovate-token
          configurationFile: tests/fixtures/does-not-exist.json
      - name: Assert action failed before the main docker run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/docker-calls.log 2>/dev/null || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing configuration file"
            exit 1
          fi
          if grep -q "RENOVATE_TOKEN" /tmp/docker-calls.log 2>/dev/null; then
            echo "FAIL: main renovate container should not have been started"
            exit 1
          fi
          echo "PASS"
