name: Test missing token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # Intentionally omit 'token' and 'RENOVATE_TOKEN' env var
        # The action should fail with an error about missing token

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when token was not provided"
