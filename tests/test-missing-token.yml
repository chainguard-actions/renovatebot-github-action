name: Test missing token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          case "$*" in
            *--version*) echo "renovate 99.0.0-fake" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          rm -f /tmp/docker-calls.log
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed without running docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no token is given"
            exit 1
          fi
          if [ -s /tmp/docker-calls.log ]; then
            echo "FAIL: docker should not be invoked"
            cat /tmp/docker-calls.log
            exit 1
          fi
          echo "PASS"
