name: Test failure when no token is provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/fake-docker.log
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-docker.log
          case "$*" in
            *--version*) echo "44.0.0" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed without running docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no token is given"
            exit 1
          fi
          if [ -s /tmp/fake-docker.log ]; then
            echo "FAIL: docker should not have been invoked"
            cat /tmp/fake-docker.log
            exit 1
          fi
          echo "PASS"
