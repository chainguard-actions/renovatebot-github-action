name: Test failure when no token is provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-docker-calls.log
          case "$*" in
            *" --version"*) echo "99.9.9-fake" ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          rm -f /tmp/fake-docker-calls.log
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed without invoking docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when token is missing"
            exit 1
          fi
          if [ -s /tmp/fake-docker-calls.log ]; then
            echo "FAIL: docker should not have been invoked"
            cat /tmp/fake-docker-calls.log
            exit 1
          fi
          echo "PASS"
