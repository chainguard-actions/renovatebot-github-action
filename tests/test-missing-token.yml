name: Test missing token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure RENOVATE_TOKEN is not set
        run: |
          if [ -n "${RENOVATE_TOKEN:-}" ]; then
            echo "RENOVATE_TOKEN unexpectedly set in environment"
            exit 1
          fi
      - id: renovate
        uses: .
        continue-on-error: true
        with:
          renovate-image: fake-renovate:does-not-matter
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.renovate.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no token is provided"
            exit 1
          fi
          echo "PASS"
