name: Test missing token - action fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # Intentionally omit 'token' input and RENOVATE_TOKEN env var
        # The action should throw: "'token' MUST be passed using its input or the 'RENOVATE_TOKEN' environment variable"

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no token was provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without a token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
