name: Test basic invocation with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with token
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '38'

      - name: Assert action ran (succeeded or failed gracefully on Docker/Renovate)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because:
          # - Docker image pull fails in the act environment
          # - Renovate fails against the sentinel GITHUB_REPOSITORY
          # But it must NOT be 'skipped' — it must have actually run.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may not have run at all"
            exit 1
          fi
