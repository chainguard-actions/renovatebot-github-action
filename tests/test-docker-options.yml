name: Test docker-cmd-file, docker-network, and docker-user inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          docker-cmd-file: /usr/local/bin/renovate
          docker-network: host
          docker-user: '1000'
        env:
          LOG_LEVEL: debug
      - name: Assert action ran with docker options inputs
        run: |
          echo "Action completed (with or without error - testing input coverage)"
          echo "PASS: inputs docker-cmd-file, docker-network, and docker-user were accepted"
