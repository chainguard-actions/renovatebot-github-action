name: Test docker options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create docker cmd file
        run: |
          cat > /tmp/renovate-cmd.sh << 'EOF'
          #!/bin/sh
          echo "Custom docker cmd executed"
          exit 0
          EOF
          chmod +x /tmp/renovate-cmd.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          docker-cmd-file: /tmp/renovate-cmd.sh
          docker-network: host
          docker-user: '1000'
          docker-volumes: /tmp:/tmp
        env:
          RENOVATE_DRY_RUN: full
          LOG_LEVEL: debug
      - name: Assert action was invoked with docker options
        run: |
          echo "Action completed (may have failed due to fake token, which is expected)"
          echo "PASS: inputs docker-cmd-file, docker-network, and docker-user were accepted"
