name: Test docker user/network/volumes/cmd-file options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          LOG="$RUNNER_TEMP/fake-docker.log"
          : > "$LOG"
          cat > "$RUNNER_TEMP/fakebin/docker" <<EOF
          #!/bin/sh
          echo "\$*" >> "$LOG"
          last=""
          for a in "\$@"; do last="\$a"; done
          if [ "\$last" = "--version" ]; then echo "41.0.0"; fi
          exit \${FAKE_DOCKER_EXIT:-0}
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          echo "FAKE_DOCKER_LOG=$LOG" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          docker-user: '1000'
          docker-network: host
          docker-volumes: '/tmp:/tmp ; /var/cache:/cache'
          docker-cmd-file: tests/fixtures/renovate-entrypoint.sh
      - name: Assert docker args
        run: |
          cat "$FAKE_DOCKER_LOG"
          main=$(tail -n1 "$FAKE_DOCKER_LOG")
          for want in "--user 1000" "--network host" "--volume /tmp:/tmp " "--volume /var/cache:/cache " \
                      "--volume $GITHUB_WORKSPACE/tests/fixtures/renovate-entrypoint.sh:/renovate-entrypoint.sh"; do
            echo "$main" | grep -qF -- "$want" || { echo "FAIL: missing '$want'"; exit 1; }
          done
          case "$main" in
            *"--rm ghcr.io/renovatebot/renovate:44 /renovate-entrypoint.sh") ;;
            *) echo "FAIL: command should follow image"; exit 1 ;;
          esac
          echo "PASS"
