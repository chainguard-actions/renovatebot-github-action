name: Test docker-user, mount-docker-socket, and docker-cmd-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dummy docker cmd file
        run: |
          mkdir -p /tmp/renovate-cmd
          cat > /tmp/renovate-cmd/renovate-cmd.sh <<'EOF'
          #!/bin/sh
          echo "Custom renovate command executed"
          exit 0
          EOF
          chmod +x /tmp/renovate-cmd/renovate-cmd.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          mount-docker-socket: 'false'
          docker-user: '1000'
          docker-cmd-file: /tmp/renovate-cmd/renovate-cmd.sh
        env:
          RENOVATE_TOKEN: fake-token-for-testing
          LOG_LEVEL: debug
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed (possibly with error due to fake token, which is expected)"
          echo "PASS: inputs mount-docker-socket, docker-user, and docker-cmd-file were accepted"
