name: Test docker options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN)$'
          mount-docker-socket: 'false'
          docker-network: bridge
          docker-user: '1000'
          docker-cmd-file: ''
        env:
          LOG_LEVEL: debug
      - name: Assert action ran (may fail due to invalid token but inputs were accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: docker option inputs were accepted by the action"
