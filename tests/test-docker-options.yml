name: Test docker options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '44'
          # Test custom docker volume mounts (semicolon-separated)
          docker-volumes: '/tmp:/tmp;/var/log:/var/log:ro'
          # Test custom docker user
          docker-user: '1000'
          # Test docker network
          docker-network: 'bridge'
      - name: Assert action ran with docker options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail at the Docker run stage,
          # but it must not fail due to invalid docker options inputs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with docker options (outcome: $OUTCOME)"
