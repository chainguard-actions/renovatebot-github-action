name: Test mount-docker-socket input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          mount-docker-socket: 'true'
          token: ${{ github.token }}
          renovate-version: '43'
      - name: Assert action was invoked with mount-docker-socket input
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action may fail because Renovate needs specific setup,
          # but we verify the input was accepted (not an input validation error)
          echo "PASS: mount-docker-socket input was accepted"
