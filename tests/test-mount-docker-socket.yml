name: Test mount-docker-socket input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mount-docker-socket input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          mount-docker-socket: 'true'
          docker-socket-host-path: /var/run/docker.sock
          renovate-version: '43'
          renovate-image: ghcr.io/renovatebot/renovate
          docker-volumes: /tmp:/tmp

      - name: Assert action ran (mount-docker-socket input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome was not set"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — mount-docker-socket input was accepted"
