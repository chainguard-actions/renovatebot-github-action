name: Test mount-docker-socket input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: dummy-token-for-mount-docker-socket-test
          mount-docker-socket: 'true'

      - name: Assert action ran with mount-docker-socket input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail (no real token/docker), but it should not be skipped.
          # We just verify the mount-docker-socket input was accepted without crashing the action setup.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — mount-docker-socket input was accepted"
