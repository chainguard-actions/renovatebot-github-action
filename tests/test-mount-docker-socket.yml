name: Test mount-docker-socket
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          LOG="$RUNNER_TEMP/fake-docker.log"
          : > "$LOG"
          cat > "$RUNNER_TEMP/fakebin/docker" <<EOF
          #!/bin/sh
          echo "\$*" >> "$LOG"
          last=""
          for a in "\$@"; do last="\$a"; done
          if [ "\$last" = "--version" ]; then echo "41.0.0"; fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          echo "FAKE_DOCKER_LOG=$LOG" >> "$GITHUB_ENV"
      - name: Create fake docker socket and ensure docker group exists
        run: |
          SOCK="$RUNNER_TEMP/fake-docker.sock"
          rm -f "$SOCK"
          if command -v python3 >/dev/null 2>&1; then
            python3 -c "import socket,sys; s=socket.socket(socket.AF_UNIX); s.bind(sys.argv[1])" "$SOCK"
          else
            node -e "const n=require('net');const s=n.createServer();s.listen(process.argv[1],()=>{s.unref();process.exit(0)})" "$SOCK"
          fi
          [ -S "$SOCK" ] || { echo "FAIL: could not create socket"; exit 1; }
          if ! grep -qE '^docker:x:[1-9][0-9]*:' /etc/group; then
            SUDO=""
            [ "$(id -u)" != "0" ] && SUDO="sudo"
            $SUDO groupadd -g 2375 docker 2>/dev/null || \
              echo 'docker:x:2375:' | $SUDO tee -a /etc/group >/dev/null
          fi
          GID=$(grep -E '^docker:x:[1-9][0-9]*:' /etc/group | head -n1 | cut -d: -f3)
          echo "docker gid: $GID"
          [ -n "$GID" ] || { echo "FAIL: no docker group"; exit 1; }
          echo "FAKE_SOCK=$SOCK" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$GID" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          mount-docker-socket: 'true'
          docker-socket-host-path: ${{ env.FAKE_SOCK }}
      - name: Assert socket mount and group-add
        run: |
          cat "$FAKE_DOCKER_LOG"
          main=$(tail -n1 "$FAKE_DOCKER_LOG")
          for want in "--volume $FAKE_SOCK:/var/run/docker.sock" "--group-add $DOCKER_GID "; do
            echo "$main" | grep -qF -- "$want" || { echo "FAIL: missing '$want'"; exit 1; }
          done
          echo "PASS"
