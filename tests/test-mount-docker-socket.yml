name: Test mount-docker-socket input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mount-docker-socket input
        id: action
        uses: .
        with:
          token: fake-token-for-testing
          renovate-version: '43'
          mount-docker-socket: 'true'
          docker-socket-host-path: /var/run/docker.sock
        continue-on-error: true

      - name: Assert action was invoked with mount-docker-socket
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should proceed past input validation since a token was provided.
          # It may fail due to Docker/network issues, but should NOT fail due to
          # missing token or invalid input handling.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted mount-docker-socket input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
