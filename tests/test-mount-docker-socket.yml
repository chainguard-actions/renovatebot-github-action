name: Test mount-docker-socket
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI that records invocations
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          rm -f /tmp/docker-calls.log
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          for last in "$@"; do :; done
          if [ "$last" = "--version" ]; then
            echo "41.99.0"
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: Create a fake unix socket and ensure a docker group exists
        run: |
          SOCK=/tmp/fake-docker.sock
          rm -f "$SOCK"
          if command -v python3 >/dev/null 2>&1; then
            python3 -c "import socket; s=socket.socket(socket.AF_UNIX); s.bind('$SOCK')"
          elif command -v perl >/dev/null 2>&1; then
            perl -MIO::Socket::UNIX -e "IO::Socket::UNIX->new(Type=>SOCK_STREAM(), Local=>'$SOCK', Listen=>1) or die"
          else
            echo "no tool to create a unix socket"; exit 1
          fi
          if [ ! -S "$SOCK" ]; then echo "FAIL: socket not created"; exit 1; fi
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          if ! grep -qE '^docker:x:[1-9][0-9]*:' /etc/group; then
            # remove a malformed docker entry if any, then add one
            $SUDO sed -i '/^docker:/d' /etc/group
            echo "docker:x:998:" | $SUDO tee -a /etc/group >/dev/null
          fi
          GID=$(grep -E '^docker:x:[1-9][0-9]*:' /etc/group | head -n1 | cut -d: -f3)
          echo "docker gid: $GID"
          echo "DOCKER_GID=$GID" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          token: input-token-123
          mount-docker-socket: 'true'
          docker-socket-host-path: /tmp/fake-docker.sock
      - name: Assert socket volume and group-add arguments
        run: |
          cat /tmp/docker-calls.log
          second=$(sed -n 2p /tmp/docker-calls.log)
          echo "run line: $second"
          for want in \
            "--volume /tmp/fake-docker.sock:/var/run/docker.sock" \
            "--group-add $DOCKER_GID " \
            "--env RENOVATE_TOKEN=input-token-123" \
            "--rm ghcr.io/renovatebot/renovate:45"; do
            case "$second " in
              *"$want"*) echo "ok: $want" ;;
              *) echo "FAIL: missing '$want' in: $second"; exit 1 ;;
            esac
          done
          echo "PASS"
