name: Test mount-docker-socket input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          mount-docker-socket: 'true'
          docker-socket-host-path: /var/run/docker.sock
        env:
          RENOVATE_DRY_RUN: full
          LOG_LEVEL: debug
      - name: Assert action was invoked with mount-docker-socket
        run: |
          echo "Action completed (may have failed due to fake token, which is expected)"
          echo "PASS: input mount-docker-socket was accepted"
