name: Test additional-env-list
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VOL: renovate-test-addenv-${{ github.run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build fake renovate image
        run: |
          docker build -t fake-renovate:test "$GITHUB_WORKSPACE/tests/fixtures/fake-renovate"
          docker volume rm -f "$VOL" || true
          docker volume create "$VOL"
      - id: renovate
        uses: .
        env:
          MY_EXTRA_VAR: hello-extra
          ANOTHER_EXTRA: second
          NOT_LISTED: nope
        with:
          token: test-token
          renovate-image: fake-renovate:test
          docker-volumes: ${{ env.VOL }}:/out
          additional-env-list: |
            MY_EXTRA_VAR
            ANOTHER_EXTRA
      - name: Assert extra env vars were passed
        run: |
          ENVOUT="$(docker run --rm -v "$VOL:/out" --entrypoint cat fake-renovate:test /out/env)"
          echo "$ENVOUT"
          fail=0
          for want in "MY_EXTRA_VAR=hello-extra" "ANOTHER_EXTRA=second" "RENOVATE_TOKEN=test-token"; do
            if ! echo "$ENVOUT" | grep -qx "$want"; then
              echo "FAIL: missing '$want'"
              fail=1
            fi
          done
          if echo "$ENVOUT" | grep -q '^NOT_LISTED='; then
            echo "FAIL: NOT_LISTED should not be passed"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "PASS"
      - name: Cleanup
        if: always()
        run: docker volume rm -f "$VOL" || true
