name: Test mount-docker-socket and docker-user inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENOVATE_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with mount-docker-socket and docker-user inputs
        id: action
        uses: .
        with:
          renovate-version: '43'
          mount-docker-socket: 'true'
          docker-user: '1000'
        continue-on-error: true

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with mount-docker-socket and docker-user inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
