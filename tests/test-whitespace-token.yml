name: Test whitespace token fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with whitespace token (expect failure)
        id: action
        uses: .
        with:
          token: 'token with spaces'
        continue-on-error: true

      - name: Assert action failed due to whitespace in token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when token contains whitespace, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when token contained whitespace"
