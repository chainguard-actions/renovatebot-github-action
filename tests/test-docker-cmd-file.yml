name: Test docker-cmd-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake docker command file
        run: |
          cat > /tmp/fake-docker-cmd.sh << 'EOF'
          #!/bin/sh
          echo "fake docker cmd executed"
          exit 0
          EOF
          chmod +x /tmp/fake-docker-cmd.sh

      - name: Run action with docker-cmd-file input
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '37.0.0'
          docker-cmd-file: /tmp/fake-docker-cmd.sh

      - name: Assert action ran with docker-cmd-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because Renovate itself errors (no repos configured, etc.)
          # but it must NOT fail due to docker-cmd-file input parsing.
          # We verify the action ran (outcome is either success or failure from Docker).
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with docker-cmd-file input, outcome=$OUTCOME"
