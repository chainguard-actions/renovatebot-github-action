name: Test docker-cmd-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake docker cmd file
        run: |
          mkdir -p /tmp/renovate-cmd
          cat > /tmp/renovate-cmd/cmd.sh << 'EOF'
          #!/bin/sh
          echo "fake renovate command executed"
          exit 0
          EOF
          chmod +x /tmp/renovate-cmd/cmd.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          docker-cmd-file: /tmp/renovate-cmd/cmd.sh
        env:
          RENOVATE_REPOSITORIES: '[]'
          LOG_LEVEL: debug
      - name: Assert action ran with docker-cmd-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with docker-cmd-file input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
