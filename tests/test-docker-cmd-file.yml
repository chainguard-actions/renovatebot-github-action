name: Test docker-cmd-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a custom docker cmd file
        run: |
          cat > /tmp/renovate-cmd.sh << 'EOF'
          #!/bin/sh
          echo "Custom renovate command executed"
          EOF
          chmod +x /tmp/renovate-cmd.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          docker-cmd-file: /tmp/renovate-cmd.sh
        env:
          LOG_LEVEL: debug
      - name: Assert action ran (docker-cmd-file input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with docker-cmd-file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or docker cmd)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
