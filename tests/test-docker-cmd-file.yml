name: Test docker-cmd-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake docker cmd file
        run: |
          echo '#!/bin/sh' > /tmp/fake-renovate-cmd.sh
          echo 'echo "fake renovate command executed"' >> /tmp/fake-renovate-cmd.sh
          chmod +x /tmp/fake-renovate-cmd.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          docker-cmd-file: /tmp/fake-renovate-cmd.sh
      - name: Assert action ran with docker-cmd-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with docker-cmd-file input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
