name: Test nonexistent configuration file error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "dummy-token-for-testing"
          configurationFile: "/nonexistent/path/to/renovate.json"

      - name: Assert action failed due to nonexistent config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when configurationFile does not exist, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when configurationFile did not exist"
