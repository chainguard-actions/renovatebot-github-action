name: Test docker run failure propagates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI that fails the main run
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          rm -f /tmp/docker-calls.log
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          for last in "$@"; do :; done
          if [ "$last" = "--version" ]; then
            echo "41.99.0"
            exit 0
          fi
          echo "simulated renovate failure" >&2
          exit 3
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: dummy-token-abc123
      - name: Assert action failed after running docker
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/docker-calls.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when docker run exits non-zero"; exit 1
          fi
          lines=$(wc -l < /tmp/docker-calls.log)
          if [ "$lines" -ne 2 ]; then
            echo "FAIL: expected 2 docker calls, got $lines"; exit 1
          fi
          echo "PASS"
