name: Test env-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN)$'
        env:
          LOG_LEVEL: debug
      - name: Assert action ran with env-regex input
        run: |
          echo "Action completed (with or without error - testing input coverage)"
          echo "PASS: input env-regex was accepted"
