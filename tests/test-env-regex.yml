name: Test custom env-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom env-regex that matches nothing
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          env-regex: '^NOMATCH_ENV_VAR$'
          renovate-version: '37.0.0'

      - name: Assert action did not fail due to env-regex or missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because Renovate itself errors (no repos configured, etc.)
          # but it must NOT fail with "token MUST be passed" error — the token is passed via input.
          # We verify the action ran (outcome is either success or failure from Docker, not from missing token).
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with custom env-regex, outcome=$OUTCOME"
