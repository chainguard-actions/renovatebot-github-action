name: Test env-regex overrides forwarded env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          CUSTOM_FOO: custom-value
          RENOVATE_SHOULD_NOT_PASS: nope
          LOG_LEVEL: debug
        with:
          token: test-token-123
          renovate-image: node:22-alpine
          docker-cmd-file: tests/fixtures/check-env-regex.js
          env-regex: '^CUSTOM_\w+$'
      - name: Assert action succeeded (script validated env filtering)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
