name: Test basic invocation with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide a token so the action passes input validation.
          # Renovate will fail when it tries to process the sentinel repo,
          # but the action should at least attempt to run Docker.
          token: ${{ github.token }}
          renovate-version: '44'

      - name: Assert action ran (passed token validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on whether Docker/Renovate
          # can run in this environment. Either way, it must not be 'skipped'.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) — token validation was passed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
