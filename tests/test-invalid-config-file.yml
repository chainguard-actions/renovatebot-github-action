name: Test invalid configuration file fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          configurationFile: /nonexistent/path/renovate.json
          renovate-version: '38'
      - name: Assert action failed due to missing config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when config file does not exist"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
