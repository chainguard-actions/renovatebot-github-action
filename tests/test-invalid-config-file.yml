name: Test invalid configuration file error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent config file (expect failure)
        id: action
        uses: .
        with:
          token: 'fake-token-no-whitespace'
          configurationFile: '/nonexistent/path/renovate.json'
        continue-on-error: true

      - name: Assert action failed due to invalid config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when config file does not exist, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when configuration file did not exist"
