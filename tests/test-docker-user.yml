name: Test docker-user input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with docker-user input
        id: action
        uses: .
        continue-on-error: true
        env:
          RENOVATE_TOKEN: 'fake-renovate-token-for-testing'
        with:
          renovate-version: '43'
          docker-user: '1000:1000'

      - name: Assert action accepted docker-user input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because it tries to run Docker with a fake token,
          # but it should NOT fail at the input validation stage for docker-user.
          # Any outcome is acceptable — we just need the input to be accepted.
          echo "PASS: action accepted docker-user input (outcome: $OUTCOME)"
