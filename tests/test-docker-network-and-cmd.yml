name: Test docker-network and docker-cmd-file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake docker cmd file
        run: |
          cat > /tmp/fake-renovate-cmd.sh << 'EOF'
          #!/bin/sh
          echo "fake renovate cmd executed"
          exit 0
          EOF
          chmod +x /tmp/fake-renovate-cmd.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          renovate-version: '38'
          docker-network: host
          docker-cmd-file: /tmp/fake-renovate-cmd.sh
      - name: Assert action ran with docker-network and docker-cmd-file (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with docker-network and docker-cmd-file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
