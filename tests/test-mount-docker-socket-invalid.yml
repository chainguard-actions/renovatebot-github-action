name: Test mount-docker-socket fails when host path is not a socket
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: test-token-123
          renovate-image: node:22-alpine
          mount-docker-socket: 'true'
          # A regular file, not a socket: the action must reject it
          docker-socket-host-path: tests/fixtures/check-env.js
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-socket docker-socket-host-path"
            exit 1
          fi
          echo "PASS"
