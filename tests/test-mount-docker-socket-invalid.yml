name: Test mount-docker-socket with a non-socket host path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI and create a non-socket file
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$T/fakebin"
          LOG="$T/docker-calls.log"
          : > "$LOG"
          cat > "$T/fakebin/docker" <<EOF
          #!/bin/sh
          echo "\$*" >> "$LOG"
          case "\$*" in
            *" --version") echo "44.0.0-fake" ;;
          esac
          exit 0
          EOF
          chmod +x "$T/fakebin/docker"
          echo "$T/fakebin" >> "$GITHUB_PATH"
          echo "DOCKER_LOG=$LOG" >> "$GITHUB_ENV"
          echo "not a socket" > "$T/not-a-socket"
          echo "FAKE_SOCK=$T/not-a-socket" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: dummy-token-123
          mount-docker-socket: 'true'
          docker-socket-host-path: ${{ env.FAKE_SOCK }}
      - name: Assert action failed and never ran the main container
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$DOCKER_LOG"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-socket docker-socket-host-path"
            exit 1
          fi
          if grep -qF -- "--group-add" "$DOCKER_LOG"; then
            echo "FAIL: main docker run should not have been invoked"
            exit 1
          fi
          echo "PASS"
