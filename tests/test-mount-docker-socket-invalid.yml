name: Test mount-docker-socket with a non-socket path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI that records invocations
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          rm -f /tmp/docker-calls.log
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          for last in "$@"; do :; done
          if [ "$last" = "--version" ]; then
            echo "41.99.0"
          fi
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          echo "not a socket" > /tmp/not-a-socket.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: input-token-123
          mount-docker-socket: 'true'
          docker-socket-host-path: /tmp/not-a-socket.txt
      - name: Assert action failed and did not run renovate
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/docker-calls.log 2>/dev/null || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-socket docker-socket-host-path"
            exit 1
          fi
          if grep -q -- "--rm ghcr.io/renovatebot/renovate:45$" /tmp/docker-calls.log 2>/dev/null \
             && [ "$(wc -l < /tmp/docker-calls.log)" -gt 1 ]; then
            echo "FAIL: renovate container should not have been run"
            exit 1
          fi
          echo "PASS"
