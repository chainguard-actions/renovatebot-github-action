name: Test custom env-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          # Custom env-regex that only passes RENOVATE_* variables
          env-regex: '^RENOVATE_\w+$'
          renovate-version: '44'

      - name: Assert action ran with custom env-regex
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept the custom env-regex input without crashing.
          # It may fail when Renovate runs (sentinel repo), but must not be skipped.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) — custom env-regex was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
