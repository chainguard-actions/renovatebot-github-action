name: Test custom env-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom env-regex that excludes RENOVATE_ vars
        id: action-no-renovate-env
        uses: .
        continue-on-error: true
        env:
          RENOVATE_TOKEN: some-token-in-env
        with:
          # This regex matches only LOG_LEVEL, not RENOVATE_* vars
          env-regex: "^LOG_LEVEL$"

      - name: Assert action failed because RENOVATE_TOKEN was filtered out by custom regex
        env:
          OUTCOME: ${{ steps.action-no-renovate-env.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when env-regex excludes RENOVATE_TOKEN and no token input is given"
            exit 1
          fi
          echo "PASS: custom env-regex correctly filtered out RENOVATE_TOKEN, causing expected failure"

      - name: Run action with custom env-regex that includes RENOVATE_ vars and explicit token
        id: action-with-token
        uses: .
        continue-on-error: true
        with:
          # Custom regex that still matches RENOVATE_ vars
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL)$"
          token: ${{ github.token }}
          # Use a non-existent config file to fail fast without pulling Docker image
          configurationFile: /nonexistent/renovate-config.json

      - name: Assert action failed on config file (not on token/regex)
        env:
          OUTCOME: ${{ steps.action-with-token.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on missing config file"
            exit 1
          fi
          echo "PASS: action with custom env-regex and valid token failed on config file as expected"
