name: Test custom env-regex input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENOVATE_TOKEN: fake-token-for-testing
      RENOVATE_PLATFORM: github
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom env-regex (may fail on Docker, not on env-regex parsing)
        id: action
        uses: .
        continue-on-error: true
        with:
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL)$'

      - name: Assert action did not fail due to env-regex parsing error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because Docker can't pull the image,
          # but it should NOT fail with a regex parsing error.
          # We accept both success and failure — the key is the env-regex was accepted.
          echo "PASS: action was invoked with custom env-regex (outcome: $OUTCOME)"
