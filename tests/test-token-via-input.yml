name: Test token provided via input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with token via input (Docker will fail but token should be accepted)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          renovate-version: '43'
          renovate-image: ghcr.io/renovatebot/renovate
          docker-volumes: /tmp:/tmp

      - name: Assert action did not fail due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail with "token MUST be passed" error.
          # It may fail due to Docker not being available in act, but that is
          # a different failure — the token was accepted via the input.
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: step outcome was not set"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) — token was accepted via input"
