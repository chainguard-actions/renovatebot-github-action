name: Test token containing whitespace is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI that records invocations
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          rm -f /tmp/docker-calls.log
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/docker-calls.log
          echo "41.99.0"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "bad token"
      - name: Assert failure and only version check ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/docker-calls.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for whitespace token"; exit 1
          fi
          lines=$(wc -l < /tmp/docker-calls.log)
          if [ "$lines" -ne 1 ]; then
            echo "FAIL: expected only the version docker call, got $lines"; exit 1
          fi
          echo "PASS"
