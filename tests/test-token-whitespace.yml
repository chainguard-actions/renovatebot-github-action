name: Test failure when token contains whitespace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/docker" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-docker-calls.log
          case "$*" in
            *" --version"*) echo "99.9.9-fake" ;;
          esac
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/docker"
          rm -f /tmp/fake-docker-calls.log
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "bad token"
      - name: Assert action failed before the main docker run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fake-docker-calls.log 2>/dev/null || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for whitespace token"
            exit 1
          fi
          n=$(cat /tmp/fake-docker-calls.log 2>/dev/null | wc -l)
          if [ "$n" -gt 1 ]; then
            echo "FAIL: main docker run should not have happened (calls: $n)"
            exit 1
          fi
          if grep -q "bad" /tmp/fake-docker-calls.log 2>/dev/null; then
            echo "FAIL: token was passed to docker"
            exit 1
          fi
          echo "PASS"
