name: Test custom renovate-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom renovate-version (expect docker failure, not input error)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          renovate-version: '38'
          renovate-image: ghcr.io/renovatebot/renovate
          docker-volumes: /tmp:/tmp

      - name: Assert action was invoked (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at docker run (can't pull image or run renovate
          # against a fake token), but it must NOT be skipped — it must have
          # been invoked with the custom inputs accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with custom renovate-version (outcome=$OUTCOME)"
