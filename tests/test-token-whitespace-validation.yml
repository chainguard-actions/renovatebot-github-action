name: Test token with whitespace fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Token with whitespace — validateArguments() must reject this
          token: "invalid token with spaces"

      - name: Assert action failed due to whitespace in token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when token contained whitespace"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with a whitespace-containing token"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
