name: Test failure when token contains whitespace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake docker CLI (records invocations)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/fake-docker.log
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-docker.log
          case "$*" in
            *--version*) echo "44.0.0" ;;
          esac
          exit 0
          EOF
          chmod +x /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "bad token"
      - name: Assert action failed before main docker run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fake-docker.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for whitespace token"
            exit 1
          fi
          lines=$(wc -l < /tmp/fake-docker.log 2>/dev/null || echo 0)
          if [ "$lines" -gt 1 ]; then
            echo "FAIL: main docker run should not have been invoked"
            exit 1
          fi
          echo "PASS"
