name: Test with valid configuration file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Renovate config file
        run: |
          mkdir -p /tmp/renovate-config
          cat > /tmp/renovate-config/renovate.json <<'EOF'
          {
            "$schema": "https://docs.renovatebot.com/renovate-schema.json",
            "extends": ["config:base"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          configurationFile: /tmp/renovate-config/renovate.json
          renovate-version: '44'

      - name: Assert action ran (passed config file validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action passes config file validation (file exists).
          # It may still fail when Renovate runs against the sentinel repo.
          # Either success or failure is acceptable — skipped is not.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME) — config file validation passed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
